<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>OMAR AUTO</title>
<style>
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
body{
  background:url('luffy.jpg') no-repeat center center fixed;
  background-size:cover;
}
#box{
  position:absolute;
  left:40px;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.85);
  padding:25px 30px;
  border-radius:20px;
  text-align:center;
  border:3px solid gold;
  box-shadow:0 0 25px #000;
  width:260px;
}
#box h1{color:white;margin:0 0 15px 0;font-size:20px}
#log{color:#00ff88;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div id="box">
  <h1>👑 صالة عمر 👑</h1>
  <div id="log">جاري التشغيل التلقائي...<br>انتظر 3 ثواني</div>
</div>

<script src="./psfree.js"></script>
<script src="./payloads.js"></script>
<script src="./loader.js"></script>
<script>
// يشتغل وحده بعد ما تحمل الصفحة
window.onload = function(){
  setTimeout(()=>{
    document.getElementById('log').innerHTML='جاري التحميل... خلي الفلاش راكب';
    try{
      if(typeof main==='function') main();
    }catch(e){
      document.getElementById('log').innerHTML='حدث الصفحة وجرب مرة ثانية';
    }
  }, 2000);
};
</script>
</body>
</html>
